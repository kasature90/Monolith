# TSF

- type: entity
  parent: BaseAutosurgeon
  id: AutosurgeonSandevistanTSF
  name: TSF autosurgeon (WJY-21X)
  description: Replaces the heart with a reverse-engineered MMC Sandevistan. Doesn't cool down as fast as the real thing.
  components:
  - type: AutoSurgeon
    targetBodyPart: Torso
    targetOrgan: Heart
    newPartProto: OrganHeartTSFSandevistan

- type: entity
  parent: BaseNFFlatpack
  id: AutosurgeonSandevistanTSFFlatpack
  name: TSF autosurgeon (WJY-21X) flatpack
  description: A flatpack used for constructing a TSF autosurgeon.
  components:
  - type: Flatpack
    entity: AutosurgeonSandevistanTSF
  - type: StaticPrice
    price: 15000
  - type: Sprite
    layers:
    - state: medical_lathe

# PDV

- type: entity
  parent: BaseAutosurgeon
  id: AutosurgeonIASPDV
  name: PDV autosurgeon (WJY-21X)
  description: Replaces the lungs with an advanced internal-air-system. Capable of filtering out most atmos gases and increasing respiratory efficiency greatly.
  components:
  - type: AutoSurgeon
    targetBodyPart: Torso
    targetOrgan: Lungs
    newPartProto: OrganInternalAirSystem

- type: entity
  parent: BaseNFFlatpack
  id: AutosurgeonIASPDVFlatpack
  name: PDV autosurgeon (LS-210 IAS) flatpack
  description: A flatpack used for constructing a PDV autosurgeon.
  components:
  - type: Flatpack
    entity: AutosurgeonIASPDV
  - type: StaticPrice
    price: 4000
  - type: Sprite
    layers:
    - state: medical_lathe

# Mieyo

- type: entity
  parent: BaseAutosurgeon
  id: BaseAutosurgeonMieyo
  abstract: true
  components:
  - type: Sprite
    state: icon-mmc

# Right mantis blade

- type: entity
  parent: BaseAutosurgeonMieyo
  id: AutosurgeonRightMantisBladeMieyo
  name: MMC autosurgeon (right mantis blade)
  description: Implants a covert deployable mantis blade into your right arm. That's really cool.
  components:
  - type: AutoSurgeon
    targetBodyPart: Arm
    targetBodyPartSymmetry: Right
    componentsToPart:
    - type: MantisBladeArm
      actionProto: ActionToggleRightMantisBlade

- type: entity
  parent: BaseNFFlatpack
