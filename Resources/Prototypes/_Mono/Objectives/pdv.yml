- type: weightedRandom
  id: PDVOperations
  weights:
    PDVOperationStealCCDisk: 0.2
    PDVOperationChimeraOrgans: 0.1
    PDVOperationTSFGear: 0.5
    PDVOperationMMCGear: 0.4
    PDVOperationMMCAndCCTheft: 0.2
    PDVOperationBodyParts: 0.05
    PDVOperationHell: 0.05
    PDVOperationHighTechAdventure: 0.3

# Mixed ops

- type: nukieOperation
  id: PDVOperationMMCAndCCTheft
  operationObjectives:
  - PDVDisarmCCObjective
  - PDVMMCToolsObjective

- type: nukieOperation
  id: PDVOperationBodyParts
  operationObjectives:
  - PDVChimeraOrgansObjective
  - PDVMMCAutosurgeonFlatpacksObjective

- type: nukieOperation
  id: PDVOperationHell
  operationObjectives:
  - PDVChimeraOrgansObjective
  - PDVStealDiskObjective
  - PDVTSFFrostObjective

- type: nukieOperation
  id: PDVOperationHighTechAdventure
  operationObjectives:
  - PDVTSFFrostObjective
  - PDVMMCToolsObjective
  - PDVComponentsObjective

# PDV CC theft stuff

- type: nukieOperation
  id: PDVOperationStealCCDisk
  operationObjectives:
  - PDVStealDiskObjective
  - PDVDisarmCCObjective

- type: entity
  parent: BaseStealObjective
  id: PDVStealDiskObjective
  components:
  - type: Objective
    difficulty: 4.0
    issuer: objective-issuer-pdv
    icon:
      sprite: Objects/Misc/nukedisk.rsi
      state: icon
  - type: StealCondition
    stealGroup: NukeDisk
    owner: objective-condition-steal-cc
    verifyMapExistence: false
    checkStealAreas: true
    checkCompanyMembers: true
    objectiveText: objective-condition-steal-title-faction
    descriptionText: objective-condition-steal-description-faction

- type: entity
  parent: BaseStealObjective
  id: PDVDisarmCCObjective
  components:
  - type: Objective
    difficulty: 1.0
    issuer: objective-issuer-pdv
    icon:
      sprite: Objects/Weapons/Guns/Battery/energy_shotgun.rsi
      state: base
  - type: StealCondition
    minCollectionSize: 2
    maxCollectionSize: 4
    stealGroup: CCWeapons
    owner: objective-condition-steal-cc
    verifyMapExistence: false
    checkStealAreas: true
    checkCompanyMembers: true
    objectiveText: objective-condition-steal-title-faction
    descriptionText: objective-condition-steal-description-faction

