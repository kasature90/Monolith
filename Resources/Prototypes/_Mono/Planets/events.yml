    - grasssnowc2
    - grasssnowc3
  # Dense, bland grass
  - !type:BiomeDecalLayer
    allowedTiles:
    - FloorSnow
    divisions: 1
    threshold: -0.35
    noise:
      seed: 0
      noiseType: Cellular
      frequency: 0.2
      fractalType: FBm
      octaves: 5
      lacunarity: 2
      cellularDistanceFunction: Euclidean
      cellularReturnType: Distance2
    decals:
    - grasssnow
    - grasssnow01
    - grasssnow02
    - grasssnow03
    - grasssnow04
    - grasssnow05
    - grasssnow06
    - grasssnow07
    - grasssnow08
    - grasssnow09
    - grasssnow10
    - grasssnow11
    - grasssnow12
    - grasssnow13
  # Little bit of coloured grass
  - !type:BiomeDecalLayer
    allowedTiles:
    - FloorSnow
    divisions: 1
    threshold: -0.0
    noise:
      seed: 0
      noiseType: Cellular
      frequency: 1
      fractalType: None
      cellularDistanceFunction: Euclidean
      cellularReturnType: Distance2
    decals:
    - bushsnowa1
    - bushsnowa2
    - bushsnowa3
    - bushsnowb3
    - bushsnowb2
    - bushsnowb3
  - !type:BiomeEntityLayer
    threshold: 0.3
    noise:
      seed: 0
      noiseType: OpenSimplex2
      fractalType: FBm
      frequency: 2
    allowedTiles:
    - FloorSnow
    entities:
    - FloraTreeConifer
  # Boulder Placement
  - !type:BiomeEntityLayer
    threshold: 0.975
    noise:
      seed: 0
      frequency: 5
      noiseType: OpenSimplex2
    allowedTiles:
    - FloorSnow
    - FloorSnowDug
    entities:
    - FloraRockSolidPlanet
  # Large rock areas
  - !type:BiomeEntityLayer
    allowedTiles:
    - FloorBasalt
    threshold: -1
    noise:
      seed: 0
      noiseType: Cellular
      frequency: 0.05
      lacunarity: 5
      fractalType: FBm
      octaves: 2
      cellularDistanceFunction: Euclidean
      cellularReturnType: Distance2
    entities:
    - WallRockBasalt
  - !type:BiomeDummyLayer
    id: Loot
  # Fill layer
  # Base tiles
  - !type:BiomeTileLayer
    threshold: -1
    tile: FloorSnowDug
  # Apply planet desert tile as noise so it doesnt look flat and boring
  - !type:BiomeTileLayer
    threshold: -0.40
    tile: FloorSnow
    noise:
      seed: 0
      noiseType: Cellular
      frequency: 0.4
      lacunarity: 2
      fractalType: FBm
      octaves: 4
      cellularDistanceFunction: Euclidean
      cellularReturnType: Distance2
  # Unvariantized tile for rock walls to be placed on
  - !type:BiomeTileLayer
