- type: entity
  id: BaseHardpoint
  parent: BaseStructure
  name: Hardpoint
  abstract: true
  components:
  - type: Sprite
    sprite: _Crescent/Structures/hardpoints.rsi
    state: medium
    drawDepth: HighFloorObjects
  - type: Transform
    noRot: false
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 3500
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
      - !type:PlaySoundBehavior
        sound:
          collection: MetalGlassBreak
  - type: Repairable
    doAfterDelay: 8
  - type: Appearance
  - type: Hardpoint
    class: Ballistic
    size: Medium
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.2,-0.2,0.2,0.2"
        # very not dense to make it easy to pull
        density: 600
        mask:
        - SmallMobMask
        layer:
        - MachineLayer
  - type: CollideOnAnchor
  - type: ShipRepairable
    repairTime: 15
    repairCost: 50 # Main cost is in the guns.
  placement:
    mode: SnapgridCenter

- type: entity
  id: HardpointDebugSuperlight
  parent: BaseHardpoint
  name: debug hardpoint superlight universal
  suffix: DO NOT MAP
  components:
  - type: Hardpoint
    class: Universal
    size: Superlight
  - type: ApcPowerReceiver
    powerLoad: 10000
  - type: Sprite
    sprite: _Crescent/Structures/hardpoints.rsi
    state: medium
  - type: ShipRepairable
    repairTime: 1
    repairCost: 0

