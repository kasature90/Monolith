    languagesSpoken:
    - NovuNederic
    languagesUnderstood:
    - NovuNederic
    # TRUST
    removeLanguagesSpoken:
    - TauCetiBasic
    removeLanguagesUnderstood:
    - TauCetiBasic

- type: startingGear
  id: JianghuiDockworkerGear
  equipment:
    pocket1: RadioHandheldNF
    pocket2: FlashlightLantern
