# BASE
## BACK - for gear and cash
- type: entity
  parent: BaseItem
  id: MonoPMCDuffelGiftBox
  name: PMC gear bundle
  description: Loot boxes? Here?
  abstract: true
  suffix: NPC Loot
  components:
  - type: Sprite
    sprite: _Mono/Clothing/NPC/pmc.rsi
    state: bag
  - type: Item
    size: Normal
  - type: Clothing
    sprite: _Mono/Clothing/NPC/pmc.rsi
    clothingVisuals:
      back:
      - state: bag-equipped
    quickEquip: false
    slots:
    - back

- type: entity
  parent: MonoPMCDuffelGiftBox
  id: ClothingBackpackDuffelMonoTier2PMC
  components:
  - type: SpawnItemsOnUse
    items:
    - id: Magazine9x19mmSubMachineGunFMJ
      prob: 0.6
    - id: Magazine9x19mmSubMachineGunFMJ
      prob: 0.6
    - id: Tourniquet
      prob: 0.4
    sound:
      path: /Audio/Items/jumpsuit_equip.ogg

