# Base
- type: entity
  name: contractor
  abstract: true
  parent:
  - BaseC3MobHuman
  - MobNonHumanHostileBase
  - MobHumanoidInvetorySimplified
  - MobHumanoidHostileAISimpleRanged
  - NFMobRestrictions
  id: MobMonoPMCBase
  description: A private military contractor. Unreasonable filth.
  suffix: PMC NPC
  components:
  - type: Damageable
    damageModifierSet: MobMercenaryDamageModifierSet
  - type: NpcFactionMember
    factions:
    - MercenariesExpeditionNF # Placeholder. Its really annoying adding more factions.
  - type: MobThresholds
    thresholds:
      0: Alive
      100: Critical
      110: Dead
  - type: SlowOnDamage
    speedModifierThresholds:
      60: 0.9
      80: 0.6
  - type: Stamina
    critThreshold: 100
  - type: DamageStateVisuals
    rotate: true
  - type: RotationVisuals
    defaultRotation: 90
    horizontalRotation: 90
  - type: Butcherable
    butcheringType: Spike
    spawned:
    - id: FoodMeatHuman
      amount: 5
  - type: RechargeBasicEntityAmmo
    rechargeCooldown: 1.5
    rechargeSound:
      path: /Audio/_NF/Effects/silence.ogg
  - type: Advertise
    pack: mercenaryhumanoidchatter
    minimumWait: 30
    maximumWait: 120
    nextAdvertisementTime: 10
  - type: AutoWakeUp
  - type: MovementSpeedModifier
    baseWalkSpeed : 4.5
    baseSprintSpeed : 4.5
  - type: FootstepModifier
    footstepSoundCollection:
      collection: FootstepTile

# Variations
## Tier 1

- type: entity
  parent: MobMonoPMCBase
  id: MobMonoPMCT1Soldier
  components:
  - type: Sprite
    drawdepth: Mobs
    layers:
    - sprite: _NF/Mobs/Species/Templates/human.rsi
      state: human
    - sprite: _Mono/Clothing/NPC/pmc.rsi
      state: pmc-uniform
