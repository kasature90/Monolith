- type: reaction
  id: Fentanyl
  impact: Low
  minTemp: 475
  reactants:
    SpaceDrugs:
      amount: 1
    Desoxyephedrine:
      amount: 2
    Cognizine:
      amount: 1
    SodiumHydroxide:
      amount: 0.5
    Phenol:
      amount: 0.5
    Kelotane:
      amount: 0.5
  products:
    Fentanyl: 5.5

- type: reaction # this reaction is to prevent people from mixing fent and dylo for combat meds, and to serve as something to prevent mass crystallization
  id: FentanylIncompatibility
  impact: High
  reactants:
    Fentanyl:
      amount: 1
    Dylovene:
      amount: 1
  effects:
  - !type:ExplosionReactionEffect
    explosionType: ESWelderBomb
    maxIntensity: 100
    intensityPerUnit: 0.65
    intensitySlope: 5
    maxTotalIntensity: 100

- type: reaction
  id: FentanylSolidification
  impact: Low
  minTemp: 310
  reactants:
    Fentanyl:
      amount: 50
    Tricordrazine:
      amount: 20
  products:
    Tricordrazine: 19
    Dylovene: 31
  effects:
    - !type:CreateEntityReactionEffect
      entity: FentanylSolidified
