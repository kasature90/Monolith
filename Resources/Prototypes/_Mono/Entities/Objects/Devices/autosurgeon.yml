# Mieyo

- type: entity
  parent: BaseAutosurgeon
  id: BaseAutosurgeonMieyo
  abstract: true
  components:
  - type: Sprite
    state: icon-mmc

# Right mantis blade

- type: entity
  parent: BaseAutosurgeonMieyo
  id: AutosurgeonRightMantisBladeMieyo
  name: MMC autosurgeon (right mantis blade)
  components:
  - type: AutoSurgeon
    targetBodyPart: Arm
    targetBodyPartSymmetry: Right
    componentsToPart:
    - type: MantisBladeArm
      actionProto: ActionToggleRightMantisBlade

- type: entity
  parent: BaseNFFlatpack
  id: AutosurgeonRightMantisBladeMieyoFlatpack
  name: MMC autosurgeon (right mantis blade) flatpack
  description: A flatpack used for constructing a MMC autosurgeon.
  components:
  - type: Flatpack
    entity: AutosurgeonRightMantisBladeMieyo
  - type: StaticPrice
    price: 2500
  - type: Sprite
    layers:
    - state: medical_lathe

