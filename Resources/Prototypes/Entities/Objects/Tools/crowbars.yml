- type: entity
  name: emergency crowbar
  parent: Crowbar
  id: CrowbarRed
  description: An emergency crowbar designed to pry open doors and firelocks during power outages.
  components:
  - type: Tag
    tags:
    - Crowbar
    - CrowbarRed
