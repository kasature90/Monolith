- type: job
  id: Cadet
  name: job-name-tsf-private
  description: job-description-tsf-private
  playTimeTracker: JobSecurityCadet
  requirements:
    - !type:OverallPlaytimeRequirement
      time: 32400 # 9 hours
    - !type:DepartmentTimeRequirement
      department: Security
      time: 72000 # 20 hours
      inverted: true # Leave slots open for newer, less confident players.
  startingGear: CadetGear
  icon: JobIconCadetNF
  supervisors: job-supervisors-tsf-private
  weight: 70
  displayWeight: 10
  assignedCompany: TSF
  canBeAntag: false
  setPreference: false
  accessGroups:
  - CadetNfsdAccess
  special:
  - !type:AddComponentSpecial
    components:
    - type: NpcFactionMember
      factions:
      - TSFMC
  - !type:AddImplantSpecial
    implants: [ MindShieldImplant, TrackingImplant ]
  - !type:AddLanguageSpecial
    languagesSpoken:
    - SolCommon
    languagesUnderstood:
    - SolCommon
  - !type:GiveItemOnHolidaySpecial
    holiday: FrontierBirthday
    prototype: FrontierBirthdayGift

- type: startingGear
  id: CadetGear
  equipment:
    pocket1: WeaponPistolMk58
    pocket2: BookSecurity
  storage:
    back:
    - Magazine45_ACPPistolFMJ
    - FederationMilitaryCredit50
    - BaseSecurityUplinkRadio
    - RadioHandheldNF
