    inverted: true
    traits:
    # Ironman gives you the LPC. The others are just free upgrades; Crocus has no bionics.
    - PrybarProsthetics
    - BionicLegs
    - Ironman
  startingGear: JianghuiDockworkerGear
  alwaysUseSpawner: true
  hideConsoleVisibility: true
  icon: "JobIconStationEngineer"
